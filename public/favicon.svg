<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="url(#grad)"/>
  <!-- Lock icon -->
  <g transform="translate(50, 50)">
    <!-- Lock body -->
    <rect x="-16" y="-8" width="32" height="24" rx="3" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Lock shackle -->
    <path d="M -12 -8 Q -12 -20 0 -20 Q 12 -20 12 -8" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="4" r="2" fill="white"/>
  </g>
</svg>
